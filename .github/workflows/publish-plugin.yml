name: Publish stable plugin branch

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.release.tag_name || github.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm audit --omit=dev --audit-level=high
      - name: Build stable plugin branch
        shell: bash
        run: |
          set -euo pipefail
          npm run build
          stage="$(mktemp -d)"
          cp packages/openclaw-plugin/package.json "$stage/"
          cp packages/openclaw-plugin/openclaw.plugin.json "$stage/"
          cp packages/openclaw-plugin/README.md "$stage/"
          cp LICENSE "$stage/"
          cp -R packages/openclaw-plugin/dist "$stage/"
          printf '%s\n' "${GITHUB_SHA}" > "$stage/SOURCE_COMMIT"
          git -C "$stage" init --initial-branch=plugin-stable
          git -C "$stage" config user.name github-actions[bot]
          git -C "$stage" config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git -C "$stage" remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          extraheader="$(git config --get http.https://github.com/.extraheader)"
          git -C "$stage" config http.https://github.com/.extraheader "$extraheader"
          git -C "$stage" add .
          version="$(node -p 'require(process.argv[1]).version' "$stage/package.json")"
          git -C "$stage" commit -m "Publish ClawCouncil plugin ${version}"
          git -C "$stage" push --force origin HEAD:plugin-stable
